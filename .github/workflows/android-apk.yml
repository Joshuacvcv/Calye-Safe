name: Build Android APK (debug)

# Builds a test-ready debug APK in the cloud — no Android Studio needed.
# Run it from the repo's Actions tab ("Run workflow"), then download the
# `calye-safe-debug-apk` artifact when the run finishes (~10–20 min).

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Set up JDK 21 (required by Capacitor 7)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # NOTE: android-actions/setup-android is intentionally NOT used — v3 is
      # broken (it tries to install the long-removed `tools` SDK package).
      # GitHub's ubuntu runners already ship an Android SDK; we just add the
      # platform / build-tools our Capacitor version targets.
      - name: Install Android platform (runner's preinstalled SDK)
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Assemble www/
        run: npm run build:www

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons (skipped until assets/icon.png exists)
        run: |
          if [ -f assets/icon.png ]; then npm run app:icons; else echo "No assets/icon.png yet — using default Capacitor icon"; fi

      - name: Add app permissions
        run: |
          python3 - <<'EOF'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          for perm in [
              'android.permission.INTERNET',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.CAMERA',
              'android.permission.POST_NOTIFICATIONS',
          ]:
              if perm not in s:
                  s = re.sub(
                      r'(<manifest[^>]*>)',
                      r'\1\n    <uses-permission android:name="%s" />' % perm,
                      s,
                      count=1,
                  )
          open(p, 'w').write(s)
          EOF

      # Password-reset deep link: lets a ph.atsu.calyesafe://reset-password
      # email link open the installed app instead of a browser. Must run after
      # `cap add android` (which creates the manifest) — like permissions above.
      - name: Add reset deep-link intent filter
        run: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          filt = ('<intent-filter>\n'
                  '                <action android:name="android.intent.action.VIEW" />\n'
                  '                <category android:name="android.intent.category.DEFAULT" />\n'
                  '                <category android:name="android.intent.category.BROWSABLE" />\n'
                  '                <data android:scheme="ph.atsu.calyesafe" />\n'
                  '            </intent-filter>\n        ')
          if 'ph.atsu.calyesafe' not in s:
              s = s.replace('</activity>', filt + '</activity>', 1)
          open(p, 'w').write(s)
          EOF

      # Firebase Cloud Messaging: needs google-services.json (from the
      # GOOGLE_SERVICES_JSON repo secret, base64) plus the google-services
      # Gradle plugin. Skipped cleanly when the secret is absent — the app
      # still builds, push just stays dormant.
      - name: Add Firebase (google-services)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'EOF'
          import os, base64
          raw = (os.environ.get('GOOGLE_SERVICES_JSON') or '').strip()
          if not raw:
              print('No GOOGLE_SERVICES_JSON secret — skipping FCM wiring.')
          else:
              open('android/app/google-services.json', 'wb').write(base64.b64decode(raw))
              print('Wrote android/app/google-services.json')
              p = 'android/build.gradle'
              s = open(p).read()
              if 'com.google.gms' not in s and 'dependencies {' in s:
                  s = s.replace('dependencies {',
                                'dependencies {\n        classpath "com.google.gms:google-services:4.4.2"', 1)
                  open(p, 'w').write(s)
                  print('Patched android/build.gradle')
              p = 'android/app/build.gradle'
              s = open(p).read()
              if "com.google.gms.google-services" not in s:
                  s = s.rstrip() + "\napply plugin: 'com.google.gms.google-services'\n"
                  open(p, 'w').write(s)
                  print('Patched android/app/build.gradle')
          EOF

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: calye-safe-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
